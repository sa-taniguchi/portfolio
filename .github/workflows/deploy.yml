name: My Portfolio Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # 【高速化】npmパッケージのインストールをスキップ

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel Project Settings
        # 【重要】ビルドの前にプロジェクトの設定をVercelから取得する
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        # 【メモリ不足解消】4GBまで拡張し、GitHub側でビルドを完結
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Nuxtのビルドに必要な環境変数をすべて紐付け
          NUXT_PUBLIC_BASE_URL: ${{ secrets.NUXT_PUBLIC_BASE_URL }}
          NUXT_PUBLIC_DOMAIN: ${{ secrets.NUXT_PUBLIC_DOMAIN }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_MICRO_CMS_API_KEY: ${{ secrets.NUXT_MICRO_CMS_API_KEY }}
          NUXT_BASIC_AUTH_USER: ${{ secrets.NUXT_BASIC_AUTH_USER }}
          NUXT_BASIC_AUTH_PASSWORD: ${{ secrets.NUXT_BASIC_AUTH_PASSWORD }}

      - name: Deploy to Vercel
        # 【最速】ビルド済みの成果物（--prebuilt）をアップロードするだけ
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}