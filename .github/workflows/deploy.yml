name: My Portfolio Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # 【高速化1】npmパッケージをキャッシュ

      - name: Install deps
        run: npm ci

      - name: Build
        # 【高速化2】メモリ上限を4GBに拡張し、GitHub側でビルドを完結させる
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # 【メモリ不足解消】
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # ビルドに必要な環境変数をここにすべて渡す
          NUXT_PUBLIC_BASE_URL: ${{ secrets.NUXT_PUBLIC_BASE_URL }}
          NUXT_PUBLIC_DOMAIN: ${{ secrets.NUXT_PUBLIC_DOMAIN }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NUXT_BASIC_AUTH_USER: ${{ secrets.NUXT_BASIC_AUTH_USER }}
          NUXT_BASIC_AUTH_PASSWORD: ${{ secrets.NUXT_BASIC_AUTH_PASSWORD }}

      - name: Deploy to Vercel
        # 【高速化3】prebuiltフラグを使い、ビルド済み成果物をアップロードするだけに
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}